<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">SVG 2 ICO</title>
  <desc id="desc">Les mots SVG et ICO avec le chiffre 2 superpose au centre</desc>
  <defs>
    <linearGradient id="background" x1="24" y1="20" x2="232" y2="236" gradientUnits="userSpaceOnUse">
      <stop stop-color="#12304A"/>
      <stop offset="1" stop-color="#081522"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#06101B" flood-opacity=".4"/>
    </filter>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#background)"/>
  <g fill="#F8FCFF" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="800" letter-spacing="2" text-anchor="middle" filter="url(#shadow)">
    <text x="128" y="100">SVG</text>
    <text x="128" y="218">ICO</text>
  </g>

  <circle cx="128" cy="139" r="39" fill="#F3A83B" stroke="#FFE0A0" stroke-width="4" filter="url(#shadow)"/>
  <text x="128" y="158" fill="#132437" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="900" text-anchor="middle">2</text>
</svg>
