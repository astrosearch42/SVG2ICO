<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">TEST</title>
  <desc id="desc">Test SVG for ICO conversion</desc>
  <defs>
    <linearGradient id="background" x1="24" y1="20" x2="232" y2="236" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ff0000"/>
      <stop offset="1" stop-color="#f200fa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#020304" flood-opacity=".4"/>
    </filter>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#background)"/>
  <g fill="#F8FCFF" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="800" letter-spacing="2" text-anchor="middle" filter="url(#shadow)">
    <text x="128" y="90">Test</text>
    <text x="128" y="200">ICO2SVG</text>
  </g>
</svg>
